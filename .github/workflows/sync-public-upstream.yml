name: Sync Public Upstream

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-upstream-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Merge PublicHIKKY develop without discarding fork changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add public-upstream https://github.com/PublicHIKKY/vket-boilerplate-nuxt.git
          git fetch public-upstream develop

          if git merge-base --is-ancestor public-upstream/develop HEAD; then
            echo 'Skmt3P/develop already contains PublicHIKKY/develop.'
            exit 0
          fi

          if ! git merge --no-edit public-upstream/develop; then
            # Keep this fork's AI/human routing on conflicting quality jobs.
            git checkout --ours -- \
              .github/workflows/{base,derived-main,main,showcases}-{check,coverage,reviewdog}.yml
            git add -- \
              .github/workflows/{base,derived-main,main,showcases}-{check,coverage,reviewdog}.yml
            if [ -n "$(git ls-files -u)" ]; then
              echo 'Unrelated upstream merge conflicts need manual review.' >&2
              exit 1
            fi
            git commit --no-edit
          fi
          # Never publish an upstream quality job without the routing rule.
          for workflow in .github/workflows/{base,derived-main,main,showcases}-{check,coverage,reviewdog}.yml; do
            grep -Fq "startsWith(github.head_ref, 'ai/')" "$workflow" || {
              echo "Quality routing needs review: $workflow" >&2
              exit 1
            }
          done
          git push origin HEAD:develop
